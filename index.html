<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Defragmentation Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        #gameCanvas {
            display: block;
            background-color: #c0c0c0;
            cursor: pointer;
        }
        
        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* App title above notice text */
        #appTitle {
            position: fixed;
            top: 40%;
            left: 50%;
            width: 80%;
            transform: translate(-50%, -50%);
            font-family: 'MS Sans Serif', sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            padding: 10px 20px;
            z-index: 998;
            text-align: center;
        }

        /* Notice text above start button */
        #noticeText {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 80%;
            transform: translate(-50%, -50%);
            font-family: 'MS Sans Serif', sans-serif;
            font-size: 12px;
            color: #000;
            padding: 15px 20px;
            z-index: 999;
            max-width: 400px;
        }
        
        #noticeText ul {
            margin: 0;
            padding-left: 20px;
            list-style-type: disc;
        }
        
        #noticeText li {
            margin: 5px 0;
            line-height: 1.4;
        }
        
        /* start button */
        #startButton {
            position: fixed;
            top: 63%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 24px;
            font-family: 'MS Sans Serif', sans-serif;
            font-size: 14px;
            font-weight: normal;
            background: #c0c0c0;
            border: 2px outset;
            border-color: #ffffff #c0c0c0 #c0c0c0 #ffffff;
            color: #000;
            cursor: pointer;
            min-width: 100px;
            text-align: center;
            z-index: 1000;
        }
        
        #startButton:hover {
            background: #d0d0d0;
        }
        
        #startButton:active {
            border: 2px inset #c0c0c0;
            background: #dfdfdf;
            transform: translate(-50%, -50%) translate(1px, 1px);
        }
        
        #startButton:focus {
            outline: 1px dotted #000;
            outline-offset: -4px;
        }
        
    </style>
</head>
<body>
    <canvas id="gameCanvas" class="fullscreen"></canvas>
    
    <!-- Title -->
    <div id="appTitle">DefragSim</div>
    
    <!-- Notice text -->
    <div id="noticeText">
        <ul>
            <li id="noticeStorage">It is a simulator and does not actually access the storage.</li>
            <li id="noticeSound">A sound effect will play.</li>
            <li><a href="https://github.com/cubic9com/DefragSim" id="noticeGitHub">Source code is available on GitHub.</a></li>
        </ul>
    </div>
    
    <!-- Start button -->
    <button id="startButton">Start</button>
    
    <!-- Audio elements for sound effects -->
    <audio id="seekSound" preload="auto">
        <!-- Seek sound will be generated programmatically -->
    </audio>
    <audio id="explosionSound" preload="auto">
        <!-- Explosion sound will be generated programmatically -->
    </audio>
    
    <script src="scripts/enums.js"></script>
    <script src="scripts/colors.js"></script>
    <script src="scripts/config.js"></script>
    <script src="scripts/platformCompat.js"></script>
    <script src="scripts/block.js"></script>
    <script src="scripts/gridManager.js"></script>
    <script src="scripts/fileManager.js"></script>
    <script src="scripts/animationManager.js"></script>
    <script src="scripts/soundManager.js"></script>
    <script src="scripts/uiRenderer.js"></script>
    <script src="scripts/defragSimulator.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
